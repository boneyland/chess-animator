name: tests-distros

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  distros:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            install: dnf install -y python3 python3-devel gcc cairo-devel pango-devel pkgconf-pkg-config stockfish
          - image: debian:stable
            install: |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y python3 python3-venv python3-dev gcc libcairo2-dev libpango1.0-dev pkg-config stockfish
          - image: archlinux:latest
            install: pacman -Syu --noconfirm python gcc cairo pango pkgconf stockfish

    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: ${{ matrix.install }}
      - name: Install and test
        run: |
          export PATH="$PATH:/usr/games"      # Debian installs stockfish there
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m unittest discover tests -v

