name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # let every combination finish so you see all failures
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pycairo/manimpango build from source on Linux and need these headers
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config stockfish
          echo "/usr/games" >> "$GITHUB_PATH"   # Debian puts stockfish there

      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config stockfish

      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install stockfish -y

      - run: python -m pip install -r requirements.txt

      - run: python -m unittest discover tests -v
